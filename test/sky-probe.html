<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>html,body{margin:0;background:#000}canvas{width:100vw;height:100vh;display:block}</style></head>
<body>
<canvas id="c"></canvas>
<script type="module">
/**
 * SKY-PROBE: equirectangular unfold of the sky, one component per channel.
 *   R = nebula background   G = starfield   B = galaxyBand
 * Renders the REAL GLSL from dist/shaders.js (utils only; our own main).
 * Also outputs the full sky (R+G+B) with a tone curve for visual inspection.
 * Exports: window.__SKYPNG__ (dataURL), window.__CHANPNG__ (R,G,B stacked)
 */
import { RAYTRACE_FRAG } from '../dist/shaders.js';

const W = 1024, H = 512;
const canvas = document.getElementById('c');
const gl = canvas.getContext('webgl2');
canvas.width = W; canvas.height = H;

const src = RAYTRACE_FRAG;
const idx = src.indexOf('void main()');
const utils = src.slice(0, idx);

/* --- channel probe shader --- */
const fsProbe = `${utils}
uniform int uMode;   /* 0 = neb, 1 = stars, 2 = galaxy, 3 = full */
void main(){
  vec2 vUv = vec2(gl_FragCoord.x / ${W}.0, gl_FragCoord.y / ${H}.0);
  float lon = (vUv.x * 2.0 - 1.0) * 3.14159265;
  float lat = (vUv.y * 2.0 - 1.0) * 1.5707963;
  vec3 d = vec3(cos(lat)*cos(lon), cos(lat)*sin(lon), sin(lat));
  vec3 full = skyColor(normalize(d));
  vec3 col;
  if (uMode == 0) {
    col = vec3(0.0030, 0.0042, 0.0078) + vec3(0.10,0.13,0.23) * fbm3(normalize(d) * 3.2 + 17.3, 3) * 0.012;
  } else if (uMode == 1) {
    col = starfield(normalize(d));
  } else if (uMode == 2) {
    col = galaxyBand(normalize(d)) * uGalaxyBright_default_;
  } else {
    col = full;
  }
  /* amplify for display; negatives off */
  col = pow(max(col, 0.0) * 6.0 + 1e-4, vec3(0.42));
  outColor = vec4(col, 1.0);
}
`.replace('uGalaxyBright_default_', '1.0');

/* --- full sky shader (no raytracer!) --- */
const fsFull = `${utils}
void main(){
  vec2 vUv = vec2(gl_FragCoord.x / ${W}.0, gl_FragCoord.y / ${H}.0);
  float lon = (vUv.x * 2.0 - 1.0) * 3.14159265;
  float lat = (vUv.y * 2.0 - 1.0) * 1.5707963;
  vec3 d = vec3(cos(lat)*cos(lon), cos(lat)*sin(lon), sin(lat));
  vec3 col = skyColor(normalize(d));
  col = pow(max(col, 0.0) * 6.0 + 1e-4, vec3(0.42));
  outColor = vec4(col, 1.0);
}
`;

const vs = `#version 300 es
precision highp float;
layout(location = 0) in vec2 aPos;
out vec2 vUv;
void main(){ vUv = aPos*0.5+0.5; gl_Position = vec4(aPos,0,1); }`;

function mk(t, s) {
  const sh = gl.createShader(t); gl.shaderSource(sh, s); gl.compileShader(sh);
  if (!gl.getShaderParameter(sh, gl.COMPILE_STATUS)) console.error(gl.getShaderInfoLog(sh));
  return sh;
}
function prog(fs) {
  const p = gl.createProgram();
  gl.attachShader(p, mk(gl.VERTEX_SHADER, vs));
  gl.attachShader(p, mk(gl.FRAGMENT_SHADER, fs));
  gl.linkProgram(p);
  return p;
}

const vao = gl.createVertexArray(); gl.bindVertexArray(vao);
const b = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, b);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1,3,-1,-1,3]), gl.STATIC_DRAW);
gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
gl.viewport(0, 0, W, H);

function run(program) {
  gl.useProgram(program);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
  const buf = new Uint8Array(W * H * 4);
  gl.readPixels(0, 0, W, H, gl.RGBA, gl.UNSIGNED_BYTE, buf);
  return buf;
}
function toPNG(buf) {
  const out = new Uint8ClampedArray(W * H * 4);
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    const s = ((H - 1 - y) * W + x) * 4, d = (y * W + x) * 4;
    out[s] = buf[d]; out[s+1] = buf[d+1]; out[s+2] = buf[d+2]; out[s+3] = 255;
  }
  const tmp = document.createElement('canvas'); tmp.width = W; tmp.height = H;
  const tctx = tmp.getContext('2d');
  const img = tctx.createImageData(W, H); img.data.set(out);
  tctx.putImageData(img, 0, 0);
  return tmp.toDataURL('image/png');
}

/* TODO: uGalaxyBright is a uniform in utils; probe shader references a const.
   Use 1.0 replacement already done. render each channel by wrapping: */
function withUniform(p, name, value) {
  const u = gl.getUniformLocation(p, name);
  if (u) gl.uniform1f(u, value);
}

const pFull = prog(fsFull);
const pProbe = prog(fsProbe);
console.log('linkfull', gl.getProgramParameter(pFull, gl.LINK_STATUS), gl.getProgramInfoLog(pFull));
console.log('linkprobe', gl.getProgramParameter(pProbe, gl.LINK_STATUS), gl.getProgramInfoLog(pProbe));

const bufFull = run(pFull);
window.__SKYPNG__ = toPNG(bufFull);

/* channel probes */
const chans = {};
for (let m = 0; m < 4; m++) {
  const u = gl.getUniformLocation(pProbe, 'uMode');
  gl.useProgram(pProbe);
  gl.uniform1i(u, m);
  chans[m] = run(pProbe);
}
window.__CHANPNG__ = [toPNG(chans[0]), toPNG(chans[1]), toPNG(chans[2])];
window.__DONE__ = true;
console.log('SKY-PROBE READY');
</script>
</body></html>
